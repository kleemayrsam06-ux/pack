name: Statistik aktualisieren

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paramiko installieren
        run: pip install paramiko

      - name: Statistik vom Server holen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: python generate_stats.py --sftp --out new_stats.json

      - name: Prüfen, ob sich Spielerdaten geändert haben
        id: check
        run: |
          python - <<'PY'
          import json, os
          new = json.load(open("new_stats.json", encoding="utf-8"))
          try:
              old = json.load(open("stats.json", encoding="utf-8"))
          except Exception:
              old = None
          changed = old is None or old.get("players") != new.get("players")
          if changed:
              os.replace("new_stats.json", "stats.json")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("changed=" + ("true" if changed else "false") + "\n")
          PY

      - name: Änderung speichern
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json
          git commit -m "Statistik aktualisiert"
          git push
